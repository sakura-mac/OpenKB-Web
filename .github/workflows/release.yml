name: Release

# 推 tag v* 触发，三平台 build + 上传到 GitHub Release
# 用法：git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 也支持手动触发（不发 release，仅 build artifact）

permissions:
  contents: write  # 创建 release / 上传 asset 需要

jobs:
  build:
    name: Build ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # 不再为 macOS Intel 单独出包：M 系 Mac 自 2020 全面替换 Intel，
        # 当前 Mac 用户绝大多数是 arm64；Intel 用户少 + macos-13 runner 排队慢，
        # 让他们走源码编译（README 方式二）即可。
        include:
          - { runner: macos-14,       os_name: darwin,  arch: arm64, goos: darwin,  goarch: arm64, ext: ''     }
          - { runner: ubuntu-latest,  os_name: linux,   arch: amd64, goos: linux,   goarch: amd64, ext: ''     }
          - { runner: ubuntu-latest,  os_name: linux,   arch: arm64, goos: linux,   goarch: arm64, ext: ''     }
          - { runner: windows-latest, os_name: windows, arch: amd64, goos: windows, goarch: amd64, ext: '.exe' }

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Build Go binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          BIN_NAME="okb-web${{ matrix.ext }}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "${BIN_NAME}" .
          ls -lh "${BIN_NAME}"

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          PKG_NAME="OpenKB-Web-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}"
          mkdir -p "dist/${PKG_NAME}"
          cp "okb-web${{ matrix.ext }}" "dist/${PKG_NAME}/"
          cp README.md LICENSE .env.example "dist/${PKG_NAME}/" 2>/dev/null || true
          # 卸载脚本：windows 用 .bat，其它平台用 .sh
          if [[ "${{ matrix.os_name }}" == "windows" ]]; then
            cp scripts/uninstall.bat "dist/${PKG_NAME}/"
          else
            cp scripts/uninstall.sh "dist/${PKG_NAME}/"
            chmod +x "dist/${PKG_NAME}/uninstall.sh"
          fi
          cd dist
          if [[ "${{ matrix.os_name }}" == "windows" ]]; then
            7z a -tzip "${PKG_NAME}.zip" "${PKG_NAME}"
          else
            tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          fi
          ls -lh

      # Windows 专属：用 Inno Setup 在 zip 之外多产一份 Setup.exe 安装器
      # zip 给"会用命令行/便携派"，Setup.exe 给"双击安装派"，并存
      - name: Build Windows installer (Inno Setup)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME"
          if ([string]::IsNullOrEmpty($version)) { $version = "dev" }
          $pkgName = "OpenKB-Web-$version-windows-amd64"
          $sourceDir = (Resolve-Path "dist\$pkgName").Path

          # SVG → ICO（windows-latest runner 自带 ImageMagick）
          # 多尺寸 ICO 让任务栏/开始菜单/explorer 不同上下文都清晰
          magick convert -background none -density 384 web\public\favicon.svg `
            -define icon:auto-resize=256,128,64,48,32,16 installer\icon.ico

          # Inno Setup 6 在 windows-latest runner 预装在 'C:\Program Files (x86)\Inno Setup 6\'
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup 未预装，从 Chocolatey 装一份..."
            choco install -y --no-progress innosetup
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }

          & $iscc "/DAppVersion=$version" "/DSourceDir=$sourceDir" "installer\windows.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败 (exit $LASTEXITCODE)" }

          # Inno 输出在 OutputDir=. 下，移到 dist/ 与其它产物并放
          Move-Item "installer\OpenKB-Web-Setup-$version.exe" "dist\"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenKB-Web-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' \) | sort
          ls -lhR artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' \) -exec sha256sum {} \; \
            | sed 's|\./[^/]*/||' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
